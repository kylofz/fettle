name: Release

'on':
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and publish release
        run: scripts/release.sh "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
