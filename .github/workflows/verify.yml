name: Verify

'on':
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test and build the extension
        run: ./gradlew --no-daemon clean test :geyser:jar
      - name: Verify the extension artifact
        run: scripts/verify-artifact.sh
